<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes séances paddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#3FA250; --green-dark:#235432; --ink:#181818; --paper:#F8F9FA; --white:#fff;
  --muted:#5c636a; --line:#e9ecef; --card:#fff; --bg:#F8F9FA; --text:#181818;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#181818;--card:#222;--text:#f1f3f5;--muted:#9aa1a8;--line:#333}
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:var(--head);text-transform:uppercase;letter-spacing:.02em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:28px 0 22px;border-bottom:6px solid var(--green)}
header .tag{color:var(--green);font-family:var(--head);letter-spacing:.12em;font-size:.85rem}
header h1{font-size:2.1rem;line-height:1.1;margin:4px 0 14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--green-dark);border-radius:10px;padding:8px 14px;font-size:.85rem}
.stat b{display:block;font-family:var(--head);font-size:1.3rem;color:#fff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center}
.tab{flex:1;border:2px solid var(--green);background:transparent;color:var(--green);font:600 1rem var(--head);text-transform:uppercase;padding:10px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--green);color:#fff}
.icon{border:0;background:var(--line);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:1rem}
.progress{height:6px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.block{margin:26px 0 8px}
.block h2{font-size:1.3rem;color:var(--green-dark);display:flex;gap:10px;align-items:center}
@media (prefers-color-scheme: dark){.block h2{color:var(--green)}}
.block h2 span{background:var(--green);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:1rem}
.block p.why{color:var(--muted);font-size:.9rem;margin:2px 0 8px 42px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row.done{opacity:.55}
.row.done .rn{text-decoration:line-through}
.chk{width:28px;height:28px;accent-color:var(--green);flex:none}
.ico{font-size:1.6rem;width:44px;height:44px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none}
@media (prefers-color-scheme: dark){.ico{background:#2c2c2c}}
.rt{flex:1;cursor:pointer;min-width:0}
.rn{font-weight:700}
.rd{color:var(--muted);font-size:.88rem}
.pill{background:var(--green);color:#fff;font-family:var(--head);border-radius:20px;padding:4px 12px;white-space:nowrap;font-size:.95rem}
.cards{display:grid;gap:16px;margin:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-margin-top:70px}
.card.flash{outline:3px solid var(--green)}
.ch{background:var(--ink);color:#fff;padding:16px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--green)}
.ch .ico{background:var(--green-dark);font-size:2rem;width:58px;height:58px}
.ch small{color:var(--green);font-family:var(--head);letter-spacing:.1em}
.ch h3{font-size:1.35rem;line-height:1.15}
.cb{padding:16px}
.dose{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dose div{flex:1;min-width:80px;background:var(--paper);border-radius:12px;text-align:center;padding:10px 6px}
@media (prefers-color-scheme: dark){.dose div{background:#2c2c2c}}
.dose b{display:block;font:700 1.6rem var(--head);color:var(--green)}
.dose span{font-size:.75rem;color:var(--muted);text-transform:uppercase}
.sec{margin:12px 0 4px;font:600 .85rem var(--head);letter-spacing:.1em;color:var(--green-dark);text-transform:uppercase}
@media (prefers-color-scheme: dark){.sec{color:var(--green)}}
.cb ul{padding-left:20px}
.confirm{font-size:.82rem;color:#b35c00;background:#fff3e0;border-radius:8px;padding:6px 10px;margin-top:10px}
.log{display:flex;gap:8px;margin-top:14px}
.log input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 1rem var(--head);text-transform:uppercase;cursor:pointer}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;display:none;align-items:center;gap:12px;border-top:4px solid var(--green);z-index:9}
.timer.on{display:flex}
.timer .t{font:700 2rem var(--head);flex:1}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px 0 90px}
@media print{.bar,.timer,.log,.progress,.chk{display:none!important}.cards{display:block}.card{break-inside:avoid;margin-bottom:12px}#vue-seance,#vue-cartes{display:block!important}header{color:#000;background:#fff}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="tag" id="tag"></div>
  <h1 id="titre"></h1>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="wrap">
  <button class="tab on" data-v="seance">Séance</button>
  <button class="tab" data-v="cartes">Cartes</button>
  <button class="icon" id="reset" title="Tout décocher">↺</button>
  <button class="icon" onclick="window.print()" title="Imprimer">🖨</button>
</div><div class="progress"><i id="prog"></i></div></div>

<main class="wrap">
  <section id="vue-seance"></section>
  <section id="vue-cartes" class="hidden cards"></section>
</main>
<div class="timer" id="timer"><div class="t" id="tt">1:30</div><button class="btn" id="tstop">Stop</button></div>
<footer>Séance conçue par mon coach · version visuelle perso</footer>

<script>
/* ===== DONNÉES : pour ajouter une séance, ajoute un objet dans SEANCES ===== */
const SEANCES = [{
  id:"s3", numero:3, titre:"Coordination & pliométrie", objectif:"Explosivité, réflexes et rotation pour le paddle",
  blocs:[
   {nom:"Échauffement", pourquoi:"Monter en température avant les sauts.", exercices:[
     {id:"velo", icone:"🚴", nom:"Vélo", series:null, reps:"12 min", repos:null, charge:"Allure 10 km/h",
      pourquoi:"Active le système cardio-respiratoire et prépare les articulations avant les sauts.",
      consignes:["Allure régulière, environ 10 km/h","Termine l'échauffement prêt à sauter"]}
   ]},
   {nom:"Coordination & pliométrie", pourquoi:"Développer réflexes, vitesse d'exécution et vitesse de frappe.", exercices:[
     {id:"sauts-longueur", icone:"🦘", nom:"Sauts en longueur", series:"3", reps:"Sauts de 1 m 10", repos:null, charge:"Poids du corps",
      pourquoi:"Travaille l'explosivité des jambes et la coordination, utiles pour les départs et les déplacements sur le court.",
      consignes:["Saut de 1 m 10, aller puis retour","Reçois-toi stable, genoux fléchis","Enchaîne avec 1 min de gainage"]},
     {id:"gainage", icone:"🧱", nom:"Gainage", series:"3", reps:"1 min", repos:null, charge:"Poids du corps",
      pourquoi:"Stabilise le tronc, qui transmet la force entre le bas du corps et le bras de frappe.",
      consignes:["Après chaque série de sauts en longueur","Corps aligné, ventre serré, respiration continue"], aconfirmer:"Gainage après chaque série de sauts (3×), d'après la note du coach."},
     {id:"sauts-verticaux", icone:"⬆️", nom:"Sauts verticaux depuis les genoux", series:"3", reps:"8", repos:null, charge:"Ball de 6 kg",
      pourquoi:"Améliore les réflexes, la rapidité et la vitesse d'exécution.",
      consignes:["Départ à genoux, ball de 6 kg","Saut vertical explosif pour te retrouver sur les pieds","Reçois-toi souplement"], aconfirmer:"Position exacte de la ball de 6 kg à confirmer avec le coach."},
     {id:"lancer-rotation", icone:"🎾", nom:"Lancer de balle en rotation externe", series:"3", reps:"12", repos:"1 min 30", charge:"Balle (poids à noter)",
      pourquoi:"Améliore la rotation et augmente la vitesse de frappe de balle.",
      consignes:["Rotation externe du buste et de l'épaule","Lance avec explosivité, contrôle le retour","Récupération : 1 min 30 entre les séries"]}
   ]},
   {nom:"Vitesse & changement de trajectoire", pourquoi:"Réactivité et appuis rapides pour les déplacements sur le court.", exercices:[
     {id:"skipping-haies", icone:"🏃", nom:"Skipping sur 2 haies + accélération 5 m", series:null, reps:"Départ gauche puis droite", repos:null, charge:"2 haies",
      pourquoi:"Travaille la fréquence d'appuis et l'accélération courte, comme sur un départ de balle.",
      consignes:["Skipping rapide à travers les 2 haies","Accélère sur 5 m après la dernière haie","Fais un départ côté gauche, puis côté droit"], aconfirmer:"Nombre de séries non indiqué."},
     {id:"haies-box", icone:"📦", nom:"2 haies avec box jumps", series:"3", reps:"3 de chaque", repos:null, charge:"Poids du corps",
      pourquoi:"Enchaîne vitesse horizontale et puissance verticale, avec un changement d'orientation.",
      consignes:["Sauts pieds joints, de profil, par-dessus les haies","Termine en sautant sur la boîte, de face","3 répétitions de chaque côté"]}
   ]},
   {nom:"Pliométrie dynamique", pourquoi:"Finisseur : tout enchaîner à haute intensité.", exercices:[
     {id:"finisher", icone:"🔥", nom:"Skipping 2 haies + box jumps + accélération 5 m", series:null, reps:"Enchaînement", repos:null, charge:"2 haies + boîte",
      pourquoi:"Combine appuis rapides, saut et sprint court pour travailler l'explosivité en conditions dynamiques.",
      consignes:["Skipping à travers les 2 haies","Box jump","Accélère sur 5 m"], aconfirmer:"Nombre de séries non indiqué."}
   ]}
  ]
}];

/* ===== APP ===== */
const $=s=>document.querySelector(s);
const S=SEANCES[0];
const key=k=>`paddle:${S.id}:${k}`;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(key(k)))??d}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(key(k),JSON.stringify(v))}catch(e){}};
const all=S.blocs.flatMap(b=>b.exercices);
let done=get('done',{}), logs=get('logs',{});

$('#tag').textContent=`SÉANCE ${S.numero}`;
$('#titre').textContent=S.titre;
$('#stats').innerHTML=[[S.blocs.length,'blocs'],[all.length,'exercices'],['~45','minutes']].map(([a,b])=>`<div class="stat"><b>${a}</b>${b}</div>`).join('');
document.title=`Séance ${S.numero} · ${S.titre}`;

function dose(e){return [e.series&&[e.series,'séries'],e.reps&&[e.reps,'reps / durée'],e.repos&&[e.repos,'repos'],e.charge&&[e.charge,'charge']].filter(Boolean)}
function sumline(e){return [e.series&&`${e.series} ×`,e.reps,e.charge&&`· ${e.charge}`].filter(Boolean).join(' ')}

function pill(e){
  if(!e.series)return e.reps.match(/^\d+ min$/)?e.reps.replace(' min',"'"):'→';
  const r=e.reps.match(/^(\d+) min$/)?e.reps.replace(' min',"'"):(e.reps.match(/^\d+(?= de|$)/)||[''])[0];
  return e.series+'×'+r;
}
function render(){
  let n=0;
  $('#vue-seance').innerHTML=S.blocs.map((b,i)=>`
    <div class="block"><h2><span>${i+1}</span>${b.nom}</h2><p class="why">${b.pourquoi}</p>
    ${b.exercices.map(e=>`<div class="row ${done[e.id]?'done':''}">
      <input class="chk" type="checkbox" data-id="${e.id}" ${done[e.id]?'checked':''} aria-label="Fait">
      <div class="ico">${e.icone}</div>
      <div class="rt" data-go="${e.id}"><div class="rn">${e.nom}</div><div class="rd">${sumline(e)}${e.repos?` · repos ${e.repos}`:''}</div></div>
      <div class="pill">${pill(e)}</div>
    </div>`).join('')}</div>`).join('');
  $('#vue-cartes').innerHTML=all.map((e,i)=>`
    <article class="card" id="c-${e.id}">
      <div class="ch"><div class="ico">${e.icone}</div><div><small>EXERCICE ${i+1}/${all.length}</small><h3>${e.nom}</h3></div></div>
      <div class="cb">
        <div class="dose">${dose(e).map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>
        <div class="sec">Pourquoi c'est bon pour le paddle</div><p>${e.pourquoi}</p>
        <div class="sec">Exécution</div><ul>${e.consignes.map(c=>`<li>${c}</li>`).join('')}</ul>
        ${e.aconfirmer?`<div class="confirm">À confirmer avec le coach : ${e.aconfirmer}</div>`:''}
        <div class="log"><input data-log="${e.id}" placeholder="Charge / note de la dernière fois" value="${(logs[e.id]||'').replace(/"/g,'&quot;')}">
        ${e.repos?`<button class="btn" data-rest="${e.repos}">⏱ Repos</button>`:''}</div>
      </div>
    </article>`).join('');
  progress();
}
function progress(){const d=all.filter(e=>done[e.id]).length;$('#prog').style.width=(100*d/all.length)+'%'}
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('#vue-seance').classList.toggle('hidden',v!=='seance');
  $('#vue-cartes').classList.toggle('hidden',v!=='cartes');
  scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.classList.contains('tab'))show(t.dataset.v);
  if(t.id==='reset'&&confirm('Tout décocher ?')){done={};set('done',done);render()}
  const go=t.closest('[data-go]');
  if(go){show('cartes');const c=$('#c-'+go.dataset.go);c.scrollIntoView();c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400)}
  if(t.dataset.rest)startTimer(t.dataset.rest);
  if(t.id==='tstop')stopTimer();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.id){done[t.dataset.id]=t.checked;set('done',done);t.closest('.row').classList.toggle('done',t.checked);progress()}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.log){logs[t.dataset.log]=t.value;set('logs',logs)}});

let iv;
function startTimer(txt){
  const m=txt.match(/(\d+)\s*min(?:\s*(\d+))?/);let s=m?(+m[1])*60+(+m[2]||0):60;
  stopTimer();$('#timer').classList.add('on');
  const tick=()=>{$('#tt').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s--<=0){clearInterval(iv);$('#tt').textContent='Go !';navigator.vibrate&&navigator.vibrate([200,100,200])}};
  tick();iv=setInterval(tick,1000);
}
function stopTimer(){clearInterval(iv);$('#timer').classList.remove('on')}
render();
</script>
</body>
</html>
