<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes séances paddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#3FA250; --green-dark:#235432; --ink:#181818; --paper:#F8F9FA;
  --muted:#5c636a; --line:#e9ecef; --card:#fff; --bg:#F8F9FA; --text:#181818; --soft:#F8F9FA;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#181818;--card:#222;--text:#f1f3f5;--muted:#9aa1a8;--line:#333;--soft:#2c2c2c}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:var(--head);text-transform:uppercase;letter-spacing:.02em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:26px 0 20px;border-bottom:6px solid var(--green)}
header .tag{color:var(--green);font-family:var(--head);letter-spacing:.12em;font-size:.85rem}
header h1{font-size:2rem;line-height:1.1;margin:4px 0 12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--green-dark);border-radius:10px;padding:8px 14px;font-size:.85rem}
.stat b{display:block;font-family:var(--head);font-size:1.3rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center}
.tab{flex:1;border:2px solid var(--green);background:transparent;color:var(--green);font:600 .95rem var(--head);text-transform:uppercase;padding:10px 4px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--green);color:#fff}
.icon{border:0;background:var(--line);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:1rem}
.progress{height:6px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 .95rem var(--head);text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn.danger{background:transparent;color:#c0392b;border:2px solid #c0392b}
.btn.sm{padding:6px 12px;font-size:.85rem}
.chip{display:inline-block;border-radius:20px;padding:3px 11px;font:600 .8rem var(--head);letter-spacing:.04em;text-transform:uppercase;background:var(--soft);color:var(--muted);border:1px solid var(--line);cursor:default}
button.chip{cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
h2.sec2{font-size:1.15rem;margin:24px 0 8px;color:var(--green-dark)}
@media (prefers-color-scheme: dark){h2.sec2{color:var(--green)}}
.hint{color:var(--muted);font-size:.9rem}

/* séance */
.block{margin:26px 0 8px}
.block h2{font-size:1.3rem;color:var(--green-dark);display:flex;gap:10px;align-items:center}
@media (prefers-color-scheme: dark){.block h2{color:var(--green)}}
.block h2 span{background:var(--green);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:1rem;flex:none}
.block p.why{color:var(--muted);font-size:.9rem;margin:2px 0 8px 42px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row.done{opacity:.55}
.row.done .rn{text-decoration:line-through}
.chk{width:28px;height:28px;accent-color:var(--green);flex:none}
.ico{font-size:1.6rem;width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.rt{flex:1;cursor:pointer;min-width:0}
.rn{font-weight:700}
.rd{color:var(--muted);font-size:.88rem}
.pill{background:var(--green);color:#fff;font-family:var(--head);border-radius:20px;padding:4px 12px;white-space:nowrap;font-size:.95rem}

/* cartes */
.cards{display:grid;gap:16px;margin:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-margin-top:70px}
.card.flash{outline:3px solid var(--green)}
.ch{background:var(--ink);color:#fff;padding:16px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--green)}
.ch .ico{background:var(--green-dark);font-size:2rem;width:58px;height:58px}
.ch small{color:var(--green);font-family:var(--head);letter-spacing:.1em}
.ch h3{font-size:1.35rem;line-height:1.15}
.cb{padding:16px}
.dose{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dose div{flex:1;min-width:80px;background:var(--soft);border-radius:12px;text-align:center;padding:10px 6px}
.dose b{display:block;font:700 1.5rem var(--head);color:var(--green)}
.dose span{font-size:.75rem;color:var(--muted);text-transform:uppercase}
.sec{margin:12px 0 4px;font:600 .85rem var(--head);letter-spacing:.1em;color:var(--green-dark);text-transform:uppercase}
@media (prefers-color-scheme: dark){.sec{color:var(--green)}}
.cb ul{padding-left:20px}
.confirm{font-size:.82rem;color:#b35c00;background:#fff3e0;border-radius:8px;padding:6px 10px;margin-top:10px}
.log{display:flex;gap:8px;margin-top:14px}
.log input,.field{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit;min-width:0;width:100%}

/* schémas */
.schema{background:var(--soft);border-radius:12px;padding:10px 6px 4px;margin-bottom:14px}
.schema.big{font-size:3.4rem;text-align:center;padding:16px}
.schema svg{display:block;margin:0 auto;width:100%;height:auto;overflow:visible}
.schema .fig{stroke:var(--text);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.schema .back{opacity:.55}
.schema .head{fill:var(--card);stroke:var(--text);stroke-width:4}
.schema .prop{stroke:var(--green);stroke-width:5;stroke-linecap:round;fill:none}
.schema .ball{fill:var(--green);stroke:var(--green-dark);stroke-width:2}
.schema .box{fill:var(--green);opacity:.85}
.schema .gnd{stroke:var(--muted);stroke-width:2;opacity:.4}
.schema .arr{stroke:var(--green);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.schema text{font:600 10px var(--head);fill:var(--muted);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}

/* accueil */
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.sc h3{font-size:1.2rem}
.sc .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.styles{display:grid;gap:10px;margin:12px 0}
.style{display:flex;gap:12px;text-align:left;width:100%;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit}
.style:hover{border-color:var(--green)}
.style .ico{flex:none}
.style b{font-family:var(--head);text-transform:uppercase;font-size:1.05rem;display:block}
.style span.d{color:var(--muted);font-size:.88rem}

/* composeur */
.eb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.eb .top{display:flex;gap:8px;align-items:center}
.tip{background:#e9f6ec;color:var(--green-dark);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
@media (prefers-color-scheme: dark){.tip{background:#1f3326;color:#bfe5c6}}
.warn{background:#fff3e0;color:#8a4600;border-radius:10px;padding:8px 12px;font-size:.88rem;margin:6px 0}
.it{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.it .nm{flex:1;min-width:140px;font-weight:700}
.it input{width:64px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px;font:inherit;text-align:center}
.it input.w{width:92px}
.mini{border:0;background:var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.picker{background:var(--soft);border-radius:12px;padding:10px;margin-top:10px}
.pk{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pk:first-of-type{border-top:0}
.pk .nm{flex:1}
.form{display:grid;gap:10px;margin:12px 0}
.form label{font:600 .8rem var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.hidden{display:none}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;display:none;align-items:center;gap:12px;border-top:4px solid var(--green);z-index:9}
.timer.on{display:flex}
.timer .t{font:700 2rem var(--head);flex:1}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px 0 90px}

/* coach Tony */
.coach{position:fixed;right:6px;bottom:0;z-index:20;display:flex;align-items:flex-end;pointer-events:none;transform:translateY(115%);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.coach.show{transform:translateY(0)}
.coach svg{width:104px;height:auto;flex:none}
.bubble{position:relative;background:#fff;color:#181818;border:3px solid #181818;border-radius:18px;padding:8px 12px;margin:0 -6px 70px 0;max-width:170px;font:700 1.05rem/1.15 var(--head);text-transform:uppercase;letter-spacing:.02em;box-shadow:3px 3px 0 var(--green);transform:rotate(-2deg)}
.bubble:after{content:"";position:absolute;right:-13px;bottom:14px;width:18px;height:18px;background:#fff;border-right:3px solid #181818;border-top:3px solid #181818;transform:rotate(45deg) skew(10deg,10deg)}
@media (prefers-reduced-motion:reduce){.coach{transition:none}}
@media print{.coach{display:none}}
@media print{.bar,.timer,.log,.progress,.chk,.acts{display:none!important}.card{break-inside:avoid;margin-bottom:12px}header{color:#000;background:#fff}}
</style>
</head>

const SUGG="Exercice suggéré (pas encore validé par le coach) : confirme séries, répétitions et charge avec lui.";

const STYLES=[
 {id:'plio',icone:'🦘',nom:'Coordination & pliométrie',desc:'Sauts, réflexes, vitesse de jambes.',blocs:[

function fig(k,dx=0,dy=0){
  const q=P[k],t=a=>`${a[0]+dx} ${a[1]+dy}`,line=(...pts)=>'M'+pts.map(t).join(' L');
  return `<path class="fig back" d="${line(q.s,...q.a[1])} ${line(q.p,...q.l[1])}"/>`+
    `<path class="fig" d="${line(q.s,q.p)} ${line(q.s,...q.a[0])} ${line(q.p,...q.l[0])}"/>`+
    `<circle class="head" cx="${q.h[0]+dx}" cy="${q.h[1]+dy}" r="9"/>`;
}
function schema(e){
  const fr=SCHEMAS[e.id];if(!fr)return `<div class="schema big">${e.icone}</div>`;
  const n=fr.length,one=n===1,crop=e.id==='gainage'||e.id==='pompes'||e.id==='gainage-lat';
  const g=fr.map((f,i)=>`<g transform="translate(${i*120} 0)"><line class="gnd" x1="2" y1="120" x2="98" y2="120"/>${f.props||''}${fig(f.p,f.dx||0,f.dy||0)}<text x="50" y="${f.label&&/5 m/.test(f.label)?150:138}">${f.label||''}</text>${i<n-1?`<path class="arr" d="M104 52 L112 60 L104 68"/>`:''}</g>`).join('');
  return `<div class="schema"><svg viewBox="0 ${crop?56:-24} ${n*120-10} ${crop?104:182}" style="max-width:${one?300:n*170}px" role="img" aria-label="Schéma de l'exercice">${g}</svg></div>`;
}

let custom=store.get('custom',[]), customEx=store.get('customEx',[]);
let doneAll=store.get('done',{}), logs=store.get('logs',{});

const exo=id=>LIB().find(e=>e.id===id)||{id,nom:'(exercice supprimé)',cat:'force',icone:'❔',pourquoi:'',consignes:[]};

const resolve=s=>s.blocs.map(b=>({nom:b.nom,pourquoi:b.pourquoi||'',ex:b.items.map(it=>({...exo(it.id),...(it.o||{})}))}));
const styleOf=id=>STYLES.find(s=>s.id===id)||STYLES[STYLES.length-1];
const dose=e=>[e.series&&[e.series,'séries'],e.reps&&[e.reps,'reps / durée'],e.repos&&[e.repos,'repos'],e.charge&&[e.charge,'charge']].filter(Boolean);
const sumline=e=>[e.series&&`${e.series} ×`,e.reps,e.charge&&`· ${e.charge}`].filter(Boolean).join(' ');
function pill(e){
  if(!e.series)return /^\d+ min$/.test(e.reps||'')?e.reps.replace(' min',"'"):'→';
  const r=/^(\d+) min$/.test(e.reps||'')?e.reps.replace(' min',"'"):((e.reps||'').match(/^\d+(?= de|$| par)/)||[''])[0];
  return e.series+'×'+r;
}

let view='home', sub='seance', curId=null, draft=null, pick=null, libCat='tous', newEx=false;
function go(v,o={}){view=v;if(o.curId)curId=o.curId;render();scrollTo(0,0)}

function render(){
  const cur=view==='seance'?seances().find(s=>s.id===curId):null;
  const T={home:'Mes séances',compose:'Composer',lib:'Exercices'};
  $('#tag').textContent=cur?'SÉANCE':'MES SÉANCES PADDLE';
  $('#titre').textContent=cur?cur.nom:T[view];
  let st;
  if(cur){const r=resolve(cur),n=r.reduce((a,b)=>a+b.ex.length,0);st=[[r.length,'blocs'],[n,'exercices'],['~'+(cur.duree||n*5),'minutes']]}
  else st=[[seances().length,'séances'],[LIB().length,'exercices'],[STYLES.length-1,'styles']];
  $('#stats').innerHTML=st.map(([a,b])=>`<div class="stat"><b>${a}</b>${b}</div>`).join('');
  document.title=cur?cur.nom:'Mes séances paddle';
  $('#nav').innerHTML=cur
    ?`<button class="icon" data-act="home" title="Retour">←</button><button class="tab ${sub==='seance'?'on':''}" data-act="sub" data-v="seance">Séance</button><button class="tab ${sub==='cartes'?'on':''}" data-act="sub" data-v="cartes">Cartes</button><button class="icon" data-act="reset" title="Tout décocher">↺</button><button class="icon" onclick="window.print()" title="Imprimer">🖨</button>`
    :[['home','Séances'],['compose','Composer'],['lib','Exercices']].map(([v,t])=>`<button class="tab ${view===v?'on':''}" data-act="go" data-v="${v}">${t}</button>`).join('');
  $('#progw').style.display=cur?'block':'none';
  $('#main').innerHTML=cur?viewSeance(cur):view==='home'?viewHome():view==='lib'?viewLib():viewCompose();
  if(cur)progress(cur);
}

/* ===== VUE SÉANCE ===== */
function cardHTML(e,i,total,key){
  return `<article class="card" id="c-${key}">
    <div class="ch"><div class="ico">${e.icone}</div><div><small>${total?`EXERCICE ${i+1}/${total} · `:''}${CATS[e.cat]||''}</small><h3>${esc(e.nom)}</h3></div></div>
    <div class="cb">${schema(e)}
      <div class="dose">${dose(e).map(([a,b])=>`<div><b>${esc(a)}</b><span>${b}</span></div>`).join('')}</div>
      <div class="sec">Pourquoi c'est bon pour le paddle</div><p>${esc(e.pourquoi)}</p>
      <div class="sec">Exécution</div><ul>${(e.consignes||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
      ${e.aconfirmer?`<div class="confirm">À confirmer avec le coach : ${esc(e.aconfirmer)}</div>`:''}
      <div class="log"><input data-log="${e.id}" placeholder="Charge / note de la dernière fois" value="${esc(logs[e.id]||'')}">
      ${e.repos?`<button class="btn" data-act="rest" data-v="${esc(e.repos)}">⏱ Repos</button>`:''}</div>
    </div></article>`;
}
function viewSeance(s){
  const R=resolve(s),done=doneAll[s.id]||{};
  const total=R.reduce((a,b)=>a+b.ex.length,0);
  if(sub==='cartes'){let n=0;return `<section class="cards">${R.flatMap((b,bi)=>b.ex.map((e,ei)=>cardHTML(e,n++,total,`${bi}-${ei}`))).join('')}</section>`}
  return R.map((b,bi)=>`<div class="block"><h2><span>${bi+1}</span>${esc(b.nom)}</h2>${b.pourquoi?`<p class="why">${esc(b.pourquoi)}</p>`:''}
    ${b.ex.map((e,ei)=>{const k=bi+'-'+ei;return `<div class="row ${done[k]?'done':''}">
      <input class="chk" type="checkbox" data-k="${k}" ${done[k]?'checked':''} aria-label="Fait">
      <div class="ico">${e.icone}</div>
      <div class="rt" data-act="open" data-k="${k}"><div class="rn">${esc(e.nom)}</div><div class="rd">${esc(sumline(e))}${e.repos?` · repos ${esc(e.repos)}`:''}</div></div>
      <div class="pill">${esc(pill(e))}</div></div>`}).join('')}</div>`).join('')||'<p class="hint">Cette séance est vide.</p>';
}
function progress(s){
  const n=s.blocs.reduce((a,b)=>a+b.items.length,0),d=Object.values(doneAll[s.id]||{}).filter(Boolean).length;
  $('#prog').style.width=(n?100*d/n:0)+'%';
}

      <input data-o="${bi}.${ei}.series" value="${esc(e.series||'')}" placeholder="séries" aria-label="Séries"><input class="w" data-o="${bi}.${ei}.reps" value="${esc(e.reps||'')}" placeholder="reps" aria-label="Répétitions"><input class="w" data-o="${bi}.${ei}.repos" value="${esc(e.repos||'')}" placeholder="repos" aria-label="Repos">
      <button class="mini" data-act="iup" data-bi="${bi}" data-ei="${ei}">▲</button><button class="mini" data-act="idown" data-bi="${bi}" data-ei="${ei}">▼</button><button class="mini" data-act="idel" data-bi="${bi}" data-ei="${ei}">✕</button></div>`}).join('')}
    <div style="margin-top:10px"><button class="btn ghost sm" data-act="pick" data-bi="${bi}">${pick&&pick.bi===bi?'Fermer':'+ Ajouter un exercice'}</button></div>
    ${pick&&pick.bi===bi?pickerHTML(sb,bi):''}</div>`}).join('')}
  <div class="acts"><button class="btn ghost sm" data-act="badd">+ Ajouter un bloc</button></div>
  <div class="acts" style="margin:22px 0 40px"><button class="btn" data-act="save">Enregistrer la séance</button><button class="btn ghost" data-act="cancel">Annuler</button></div>`;
}
function pickerHTML(sb,bi){
  const sug=(sb&&sb.cats)||[];
  const l=LIB().filter(e=>pick.cat==='tous'?true:pick.cat==='sug'?sug.includes(e.cat):e.cat===pick.cat);
  return `<div class="picker"><div class="chips" style="margin-top:0">${sug.length?`<button class="chip ${pick.cat==='sug'?'on':''}" data-act="pcat" data-v="sug">Conseillés</button>`:''}<button class="chip ${pick.cat==='tous'?'on':''}" data-act="pcat" data-v="tous">Tous</button>${Object.entries(CATS).map(([k,v])=>`<button class="chip ${pick.cat===k?'on':''}" data-act="pcat" data-v="${k}">${v}</button>`).join('')}</div>
  ${l.map(e=>`<div class="pk"><span class="ico" style="width:34px;height:34px;font-size:1.2rem">${e.icone}</span><div class="nm"><b>${esc(e.nom)}</b><div class="hint">${CATS[e.cat]} · ${esc(sumline(e))}</div></div><button class="btn sm" data-act="add" data-bi="${bi}" data-id="${e.id}">+</button></div>`).join('')||'<p class="hint">Aucun exercice dans cette famille.</p>'}</div>`;
}

/* ===== ACTIONS ===== */
const mv=(a,i,j)=>{if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
const clone=o=>JSON.parse(JSON.stringify(o));
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset,bi=+d.bi,ei=+d.ei;
  switch(a){
   case 'go':return go(d.v);
   case 'home':return go('home');
   case 'sub':sub=d.v;return go('seance');
   case 'openS':sub='seance';return go('seance',{curId:d.id});
   case 'open':{sub='cartes';render();const c=$('#c-'+d.k);scrollTo(0,0);if(c){c.scrollIntoView();c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400)}return}
   case 'reset':if(confirm('Tout décocher ?')){doneAll[curId]={};store.set('done',doneAll);return render()}return;
   case 'dup':{const s=clone(seances().find(x=>x.id===d.id));s.id='c'+Date.now();s.nom=s.nom.replace(/^Séance \d+ · /,'')+' (copie)';delete s.builtin;delete s.duree;custom.push(s);store.set('custom',custom);return go('home')}
   case 'edit':draft=clone(custom.find(x=>x.id===d.id));pick=null;return go('compose');
   case 'del':if(confirm('Supprimer cette séance ?')){custom=custom.filter(x=>x.id!==d.id);store.set('custom',custom);render()}return;
   case 'newdraft':{const s=styleOf(d.id);draft={id:'c'+Date.now(),nom:'',style:s.id,blocs:s.blocs.map(b=>({nom:b.nom,items:[]}))};pick=null;return render()}
   case 'cancel':draft=null;pick=null;return render();
   case 'save':{
     if(!draft.blocs.some(b=>b.items.length))return alert('Ajoute au moins un exercice.');
     draft.nom=draft.nom.trim()||'Ma séance';
     const i=custom.findIndex(x=>x.id===draft.id);i>=0?custom[i]=draft:custom.push(draft);store.set('custom',custom);
     const id=draft.id;draft=null;pick=null;sub='seance';return go('seance',{curId:id})}
   case 'bup':mv(draft.blocs,bi,bi-1);return render();
   case 'bdown':mv(draft.blocs,bi,bi+1);return render();
   case 'bdel':if(!draft.blocs[bi].items.length||confirm('Supprimer ce bloc ?')){draft.blocs.splice(bi,1);pick=null;render()}return;
   case 'badd':draft.blocs.push({nom:'Nouveau bloc',items:[]});return render();
   case 'iup':mv(draft.blocs[bi].items,ei,ei-1);return render();
   case 'idown':mv(draft.blocs[bi].items,ei,ei+1);return render();
   case 'idel':draft.blocs[bi].items.splice(ei,1);return render();
   case 'pick':{const sb=styleOf(draft.style).blocs[bi];pick=pick&&pick.bi===bi?null:{bi,cat:sb&&sb.cats.length?'sug':'tous'};return render()}
   case 'pcat':pick.cat=d.v;return render();
   case 'add':draft.blocs[bi].items.push({id:d.id,o:{}});return render();
   case 'libcat':libCat=d.v;return render();
   case 'newex':newEx=!newEx;return render();
   case 'saveex':{
     const v=i=>$('#'+i).value.trim();if(!v('n-nom'))return alert('Donne un nom à l\'exercice.');
     customEx.push({id:'x'+Date.now(),cat:v('n-cat'),icone:'⭐',nom:v('n-nom'),series:v('n-series')||null,reps:v('n-reps')||null,repos:v('n-repos')||null,charge:v('n-charge')||null,pourquoi:v('n-why'),consignes:v('n-cons').split('\n').map(x=>x.trim()).filter(Boolean)});
     store.set('customEx',customEx);newEx=false;return render()}
   case 'export':{const b=new Blob([JSON.stringify({custom,customEx},null,1)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='mes-seances-paddle.json';u.click();return}
   case 'rest':return startTimer(d.v);
   case 'tstop':return stopTimer();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.k){if(t.checked)cheer();const m=doneAll[curId]||(doneAll[curId]={});m[t.dataset.k]=t.checked;store.set('done',doneAll);t.closest('.row').classList.toggle('done',t.checked);progress(seances().find(s=>s.id===curId))}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);(j.customEx||[]).forEach(x=>{if(!customEx.some(y=>y.id===x.id))customEx.push(x)});(j.custom||[]).forEach(x=>{if(!custom.some(y=>y.id===x.id))custom.push(x)});store.set('custom',custom);store.set('customEx',customEx);render()}catch(e){alert('Fichier invalide.')}};r.readAsText(t.files[0])}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.log){logs[t.dataset.log]=t.value;store.set('logs',logs)}
  if(t.id==='d-nom')draft.nom=t.value;
  if(t.dataset.bn!==undefined)draft.blocs[+t.dataset.bn].nom=t.value;
  if(t.dataset.o){const [b,e,f]=t.dataset.o.split('.');const it=draft.blocs[+b].items[+e];(it.o=it.o||{})[f]=t.value}
});

let ct;
function cheer(){const c=$('#coach');c.classList.add('show');clearTimeout(ct);ct=setTimeout(()=>c.classList.remove('show'),2600)}
let iv;
function startTimer(txt){
  const m=String(txt).match(/(\d+)\s*(min|s)(?:\s*(\d+))?/);let s=60;
  if(m)s=m[2]==='min'?(+m[1])*60+(+m[3]||0):+m[1];
  stopTimer();$('#timer').classList.add('on');
  const tick=()=>{$('#tt').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s--<=0){clearInterval(iv);$('#tt').textContent='Go !';navigator.vibrate&&navigator.vibrate([200,100,200])}};
  tick();iv=setInterval(tick,1000);
}
function stopTimer(){clearInterval(iv);$('#timer').classList.remove('on')}
render();
</script>
</body>
</html>
